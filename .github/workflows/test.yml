name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Guards the service-worker VERSION hash and the app-shell precache list
      - run: node --test tests/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Guards the validator, the converter, and conferences/index.json drift
      - run: python -m unittest discover -s tools -v
